# Modest heap sizes: the Flutter template default (8G heap / 4G metaspace)
# exhausted memory on developer machines during Dart kernel compilation.
# 3G is plenty for this project and leaves RAM free for the Dart compiler.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 DSL compatibility (Flutter 3.47): the Flutter Gradle Plugin still
# reads the legacy AbstractAppExtension surface. Enabling the new AGP DSL
# (newDsl=true) breaks the plugin with a cast error
# (ApplicationExtensionImpl -> AbstractAppExtension). This opt-out is
# Flutter's supported compatibility mode and is removed once the Flutter
# tool completes its own new-DSL migration (flutter issue #184838/#184839).
android.newDsl=false
# Built-in Kotlin migration (Flutter 3.47): Kotlin is compiled by AGP 9.2's
# built-in Kotlin support — the app does NOT apply the Kotlin Gradle
# Plugin. AGP's built-in Kotlin resolves KGP 2.2.10; KGP 2.3.20 (Flutter's
# supported range) is raised via the settings plugin classpath
# (settings.gradle.kts, apply false — what Flutter's checker reads) and
# the root buildscript classpath (android/build.gradle.kts).
android.builtInKotlin=true
