# Modest heap sizes: the Flutter template default (8G heap / 4G metaspace)
# exhausted memory on developer machines during Dart kernel compilation.
# 3G is plenty for this project and leaves RAM free for the Dart compiler.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 new DSL: AGP 9+ only reads the new DSL interfaces. Opting out
# (android.newDsl=false) keeps the legacy adapter path, where the Kotlin
# version resolves from the build classpath instead of Flutter's embedded
# built-in Kotlin — the source of the detected-2.2.10-vs-min-2.2.20 error.
android.newDsl=true
# Built-in Kotlin migration (Flutter 3.47): Kotlin is compiled by
# Flutter's embedded toolchain — the app no longer applies the Kotlin
# Gradle Plugin, which will be unsupported in future Flutter versions.
android.builtInKotlin=true
